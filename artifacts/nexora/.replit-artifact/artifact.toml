kind = "web"
previewPath = "/"
title = "NEXORA Commerce"
description = "A production-style fashion and lifestyle commerce experience with searchable products, persistent cart and wishlist flows, checkout, orders, and protected admin operations."
version = "1.0.0"
id = "artifacts/nexora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23292

[services.development]
run = "pnpm --filter @workspace/nexora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexora", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23292"
BASE_PATH = "/"
